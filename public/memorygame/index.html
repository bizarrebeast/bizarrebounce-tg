<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BizarreBeasts Memory Game</title>

    <!-- OG / Twitter -->
    <meta property="og:title" content="BizarreBeasts Memory Game" />
    <meta property="og:description" content="Match the BizarreBeasts. Fewer moves, faster time, higher score." />
    <meta property="og:image" content="https://memorygame-tg.bizarrebeasts.io/memorygame-tg-splash-image-640x360.png" />
    <meta property="og:url" content="https://memorygame-tg.bizarrebeasts.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BizarreBeasts" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BizarreBeasts Memory Game" />
    <meta name="twitter:description" content="Match the BizarreBeasts. Fewer moves, faster time, higher score." />
    <meta name="twitter:image" content="https://memorygame-tg.bizarrebeasts.io/memorygame-tg-splash-image-640x360.png" />

    <!-- Third-party SDKs + analytics. data-kids-strip marks these for removal in the COPPA kids build. -->
    <script data-kids-strip src="https://cdn.jsdelivr.net/npm/@farcade/game-sdk@latest/dist/index.min.js"></script>
    <script data-kids-strip src="https://telegram.org/js/telegram-web-app.js"></script>
    <script data-kids-strip async src="https://www.googletagmanager.com/gtag/js?id=G-ELH2WGKGQX"></script>
    <script data-kids-strip>
      window.dataLayer = window.dataLayer || [];

    <!-- Slackey display font (matches the BizarreBeasts mini-app / Checkerz / TicTacToe) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Slackey&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'CardenioModernBold';
            src: url('./assets/CardenioModern-Bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'CardenioModernRegular';
            src: url('./assets/CardenioModern-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --teal:   #20b2aa;
            --teal-d: #178a83;
            --purple: #9370db;
            --yellow: #ffcc00;
            --pink:   #ff1493;
            --coral:  #ff7a33;
            --ink:    #000000;
            --panel:  #161334;
            --panel-2:#221c4d;
            /* chunky shared tokens */
            --line: 3px;
            --line-2: 4px;
            --radius: 16px;
            --drop: 0 5px 0 rgba(0,0,0,0.38);
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            /* BizarreBeasts sunset: hot pink -> coral -> orange -> purple dusk */
            background:
                radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,0.18), rgba(255,255,255,0) 45%),
                linear-gradient(180deg,
                #ff1493 0%, #ff5a8c 16%, #ff8c42 40%,
                #ffb347 54%, #b06ad6 80%, #6a4fb0 100%);
            background-attachment: fixed;
            font-family: 'CardenioModernRegular', serif;
            color: #ffffff;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        #app {
            width: 100%;
            max-width: 460px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* ---------- Header: logo + wordmark in a compact row ---------- */
        #header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-shrink: 0;
            padding-top: 2px;
        }
        #header img {
            width: 52px;
            height: 52px;
            display: block;
            filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.4));
            flex-shrink: 0;
        }
        #header h1 {
            font-family: 'Slackey', cursive;
            font-size: clamp(19px, 6.4vw, 30px);
            color: var(--yellow);
            margin: 0;
            line-height: 1.05;
            text-align: left;
            letter-spacing: .2px;
            text-shadow:
                -2px -2px 0 #000, 2px -2px 0 #000,
                -2px  2px 0 #000, 2px  2px 0 #000,
                 0   -2px 0 #000, 0    2px 0 #000,
                -2px  0   0 #000, 2px  0   0 #000,
                 3px  5px 0 rgba(0,0,0,0.28);
        }
        #header h1 .small { display: block; font-size: .62em; color: #fff; }

        /* ---------- Framed board panel ---------- */
        #board-frame {
            position: relative;
            background:
                linear-gradient(180deg, var(--panel-2), var(--panel));
            border: var(--line-2) solid var(--yellow);
            border-radius: 22px;
            padding: 12px;
            box-shadow: 0 0 0 var(--line) #000, 0 12px 30px rgba(0,0,0,0.45),
                        inset 0 2px 0 rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1 1 auto;
            min-height: 0;
        }
        #canvas {
            background: transparent;
            touch-action: none;
            display: block;
        }

        /* ---------- HUD: three no-wrap stat chips ---------- */
        #bottom-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
            width: 100%;
            align-items: stretch;
        }
        #hud {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .chip {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            padding: 7px 6px 8px;
            background: var(--teal);
            border: var(--line) solid #000;
            border-radius: var(--radius);
            box-shadow: var(--drop);
            white-space: nowrap;
        }
        .chip.score { background: var(--purple); flex: 1.25 1 0; }
        .chip .label {
            font-family: 'Slackey', cursive;
            font-size: 10px;
            letter-spacing: 1.2px;
            color: rgba(255,255,255,0.85);
            text-transform: uppercase;
            line-height: 1;
        }
        .chip .value {
            font-family: 'Slackey', cursive;
            font-size: clamp(16px, 5vw, 22px);
            color: #fff;
            line-height: 1.05;
            text-shadow: 1px 2px 0 rgba(0,0,0,0.35);
            font-variant-numeric: tabular-nums;
        }

        /* ---------- Difficulty: chunky segmented control ---------- */
        #difficulty {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .seg {
            flex: 1 1 0;
            min-width: 0;
            cursor: pointer;
            border: var(--line) solid #000;
            border-radius: var(--radius);
            background: #fff;
            color: #1a1430;
            box-shadow: var(--drop);
            padding: 8px 4px 9px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            transition: transform .06s ease, background .12s ease;
            font-family: inherit;
        }
        .seg .seg-name {
            font-family: 'Slackey', cursive;
            font-size: clamp(13px, 4vw, 17px);
            line-height: 1;
        }
        .seg .seg-grid {
            font-family: 'CardenioModernBold', 'CardenioModernRegular', serif;
            font-size: 13px;
            opacity: .72;
            line-height: 1;
            letter-spacing: .3px;
        }
        .seg:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(0,0,0,0.38); }
        .seg[aria-pressed="true"] {
            background: var(--yellow);
            color: #1a1430;
            box-shadow: var(--drop), inset 0 0 0 2px rgba(0,0,0,0.08);
        }
        .seg[aria-pressed="true"] .seg-grid { opacity: .85; }

        /* ---------- New Game button ---------- */
        .btn {
            width: 100%;
            cursor: pointer;
            font-family: 'Slackey', cursive;
            border: var(--line) solid #000;
            border-radius: var(--radius);
            box-shadow: var(--drop);
            padding: 11px 16px 13px;
            font-size: clamp(15px, 4.6vw, 19px);
            color: #1a1430;
            transition: transform .06s ease, filter .12s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(0,0,0,0.38); }
        .btn-coral { background: var(--coral); color: #2a1206; }
        .btn-yellow { background: var(--yellow); }
        .btn-restart-glyph {
            width: 16px; height: 16px; flex-shrink: 0;
            border: 3px solid currentColor; border-right-color: transparent;
            border-radius: 50%;
            position: relative;
        }
        .btn-restart-glyph::after {
            content: ""; position: absolute; top: -3px; right: -3px;
            border: 5px solid transparent; border-bottom-color: currentColor;
            transform: rotate(120deg);
        }

        /* ---------- Win overlay ---------- */
        #win {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            overflow: hidden;
            z-index: 50;
            background: rgba(11, 9, 28, 0.62);
            backdrop-filter: blur(2px);
        }
        #win.show { display: flex; }
        #win-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 320px;
            background: linear-gradient(180deg, #fff, #fbf4ff);
            border: var(--line-2) solid #000;
            border-radius: 22px;
            box-shadow: 0 0 0 var(--line) var(--yellow), 0 18px 40px rgba(0,0,0,0.5);
            padding: 18px 18px 20px;
            text-align: center;
            color: #1a1430;
            transform: scale(0.7);
            animation: pop-in .42s cubic-bezier(.2,1.4,.4,1) forwards;
        }
        @keyframes pop-in { from { transform: scale(0.7); } to { transform: scale(1); } }
        #win-title {
            font-family: 'Slackey', cursive;
            font-size: clamp(26px, 9vw, 38px);
            color: var(--pink);
            margin: 0 0 2px;
            line-height: 1;
            text-shadow: -2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000, 3px 4px 0 rgba(0,0,0,.18);
        }
        #win-sub {
            font-family: 'CardenioModernBold', serif;
            font-size: 14px;
            color: #6a5a8a;
            margin: 0 0 12px;
            letter-spacing: .3px;
        }
        #win-score-wrap {
            background: var(--purple);
            border: var(--line) solid #000;
            border-radius: 16px;
            padding: 8px 10px 10px;
            margin-bottom: 12px;
            box-shadow: var(--drop);
        }
        #win-score-wrap .label {
            font-family: 'Slackey', cursive; font-size: 11px; letter-spacing: 1.4px;
            color: rgba(255,255,255,.9); text-transform: uppercase;
        }
        #win-score {
            font-family: 'Slackey', cursive;
            font-size: clamp(34px, 12vw, 50px);
            color: #fff; line-height: 1;
            text-shadow: 2px 3px 0 rgba(0,0,0,.35);
            font-variant-numeric: tabular-nums;
        }
        #win-recap {
            display: flex; gap: 8px; margin-bottom: 14px;
        }
        #win-recap .rchip {
            flex: 1; background: var(--teal); border: var(--line) solid #000;
            border-radius: 14px; padding: 6px 4px 7px; box-shadow: var(--drop); color:#fff;
        }
        #win-recap .rlabel { font-family:'Slackey',cursive; font-size:10px; letter-spacing:1px; color:rgba(255,255,255,.88); text-transform:uppercase; }
        #win-recap .rvalue { font-family:'Slackey',cursive; font-size:20px; line-height:1.1; text-shadow:1px 2px 0 rgba(0,0,0,.3); font-variant-numeric: tabular-nums; }
        #win-actions { display: flex; flex-direction: column; gap: 9px; }

        /* confetti */
        #confetti { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .confetti-piece {
            position: absolute; top: -16px; width: 11px; height: 16px;
            border: 2px solid rgba(0,0,0,.55);
            border-radius: 2px;
            will-change: transform, opacity;
            animation: confetti-fall linear forwards;
        }
        @keyframes confetti-fall {
            0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            85%  { opacity: 1; }
            100% { transform: translateY(115%) rotate(720deg); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            #win-card { animation: none; transform: none; }
            .confetti-piece { display: none; }
        }
    </style>
</head>
<body>
    <div id="app">
        <header id="header">
            <img src="./assets/BizarreBeasts_Logo_-_yellow.png" alt="BizarreBeasts Logo">
            <h1>BizarreBeasts<span class="small">Memory Game</span></h1>
        </header>

        <div id="board-frame">
            <canvas id="canvas"></canvas>
        </div>

        <div id="bottom-section">
            <div id="hud">
                <div class="chip"><span class="label">Time</span><span class="value" id="timer">0:00</span></div>
                <div class="chip"><span class="label">Moves</span><span class="value" id="moves">0</span></div>
                <div class="chip score"><span class="label">Score</span><span class="value" id="score">10000</span></div>
            </div>
            <div id="difficulty" role="group" aria-label="Difficulty">
                <button class="seg" data-difficulty="easy" aria-pressed="true"><span class="seg-name">Easy</span><span class="seg-grid">4 x 4</span></button>
                <button class="seg" data-difficulty="medium" aria-pressed="false"><span class="seg-name">Medium</span><span class="seg-grid">4 x 6</span></button>
                <button class="seg" data-difficulty="hard" aria-pressed="false"><span class="seg-name">Hard</span><span class="seg-grid">4 x 8</span></button>
            </div>
            <button class="btn btn-coral" id="new-game"><span class="btn-restart-glyph"></span>New Game</button>
        </div>
    </div>

    <div id="win" role="dialog" aria-modal="true" aria-labelledby="win-title">
        <div id="confetti"></div>
        <div id="win-card">
            <h2 id="win-title">You Win!</h2>
            <p id="win-sub">Easy &middot; 4x4 cleared</p>
            <div id="win-score-wrap">
                <div class="label">Score</div>
                <div id="win-score">0</div>
            </div>
            <div id="win-recap">
                <div class="rchip"><div class="rlabel">Time</div><div class="rvalue" id="win-time">0:00</div></div>
                <div class="rchip"><div class="rlabel">Moves</div><div class="rvalue" id="win-moves">0</div></div>
            </div>
            <div id="win-actions">
                <button class="btn btn-coral" id="win-next">Try Medium Next</button>
                <button class="btn btn-yellow" id="win-again">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const timerDisplay = document.getElementById('timer');
        const movesDisplay = document.getElementById('moves');
        const scoreDisplay = document.getElementById('score');
        const bottomSection = document.getElementById('bottom-section');
        const segButtons = Array.from(document.querySelectorAll('.seg'));
        const newGameBtn = document.getElementById('new-game');
        const winEl = document.getElementById('win');

        // ============================================
        // SDK + tracking — multi-host (Farcade + Telegram), GA4
        // ============================================
        const TG = window.Telegram?.WebApp;
        const inTelegram = !!(TG && TG.initData);
        const GAME_ID = 'memorygame';
        let currentPlayId = null;
        let pendingTrack = Promise.resolve();

        function trackGA(event, params = {}) {
            if (typeof gtag !== 'function') return;
            const host = inTelegram ? 'telegram' : (window.FarcadeSDK ? 'farcade' : 'web');
            gtag('event', event, { game_id: GAME_ID, host, ...params });
        }

        function trackTG(event, payload = {}) {
            if (!inTelegram) return Promise.resolve(null);
            pendingTrack = pendingTrack.then(() =>
                fetch('/api/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ event, game: GAME_ID, initData: TG.initData, ...payload }),
                    keepalive: true,
                }).then(r => r.ok ? r.json() : null).catch(() => null)
            );
            return pendingTrack;
        }

        if (inTelegram) {
            TG.ready(); TG.expand(); TG.disableVerticalSwipes?.();
            fetch('/api/me', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: TG.initData, game: GAME_ID }),
            }).catch(() => {});
        }

        // Game configuration
        const GRID_SIZES = {
            easy:   [4, 4],  // rows, cols (8 pairs)
            medium: [6, 4],  // (12 pairs)
            hard:   [8, 4]   // (16 pairs)
        };
        const DIFF_LABEL = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
        const DIFF_GRID  = { easy: '4x4', medium: '4x6', hard: '4x8' };
        const NEXT_DIFF  = { easy: 'medium', medium: 'hard', hard: null };
        let CARD_SIZE = 80;
        const GAP = 7;

        // Game state
        let difficulty = 'easy';
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let time = 0;
        let timerInterval;
        let timerStarted = false;
        let gameLocked = false;
        let score = 10000;
        let isMuted = false;
        let gameWon = false;

        // ---- Scoring (live) ----
        function computeScore() {
            const baseScore = 10000;
            const timePenalty = time * 50;
            const movePenalty = moves * 100;
            return Math.max(0, baseScore - timePenalty - movePenalty);
        }
        function updateScore() {
            score = computeScore();
            scoreDisplay.textContent = score.toLocaleString('en-US');
        }

        function setMuted(muted) { isMuted = muted; }

        // ============================================
        // Animation timing
        // ============================================
        const FLIP_MS = 300;
        const POP_MS = 360;
        const SHAKE_MS = 360;
        let animating = false;
        let lastTs = null;

        function ensureTicker() {
            if (!animating) { animating = true; lastTs = null; requestAnimationFrame(tick); }
        }
        function tick(now) {
            if (lastTs === null) lastTs = now;
            const dt = now - lastTs;
            lastTs = now;
            let active = false;
            for (const c of cards) {
                if (c.flipping) {
                    c.flipProgress += dt / FLIP_MS;
                    if (c.flipProgress >= 1) {
                        c.flipProgress = 0; c.flipping = false; c.flipped = c.flipTarget;
                        if (c.onFlipDone) { const f = c.onFlipDone; c.onFlipDone = null; f(); }
                    } else active = true;
                }
                if (c.popT !== null) {
                    c.popT += dt / POP_MS;
                    if (c.popT >= 1) c.popT = null; else active = true;
                }
                if (c.shakeT !== null) {
                    c.shakeT += dt / SHAKE_MS;
                    if (c.shakeT >= 1) c.shakeT = null; else active = true;
                }
            }
            draw();
            if (active) requestAnimationFrame(tick);
            else { animating = false; lastTs = null; }
        }

        // Adjust card size based on viewport width and height
        function adjustCardSize() {
            const FRAME = 2 * (12 + 4 + 3); // padding + border + outline, both sides
            const containerWidth = Math.min(window.innerWidth - 20, 460) - FRAME;
            const containerHeight = window.innerHeight - 16;

            const headerHeight = document.getElementById('header').offsetHeight || 60;
            const bottomSectionHeight = bottomSection.offsetHeight || 150;
            // header + bottom + frame chrome + body padding + the two flex gaps (10px each)
            const totalNonCanvasHeight = headerHeight + bottomSectionHeight + FRAME + 16 + 20;

            const availableHeight = containerHeight - totalNonCanvasHeight;
            const [rows, cols] = GRID_SIZES[difficulty];

            const widthBasedCardSize = (containerWidth - (cols - 1) * GAP) / cols;
            const heightBasedCardSize = (availableHeight - (rows - 1) * GAP) / rows;

            CARD_SIZE = Math.max(24, Math.floor(Math.min(widthBasedCardSize, heightBasedCardSize)));

            setupCanvas(rows, cols);

            if (cards.length) {
                cards.forEach((card, k) => {
                    card.x = (k % cols) * (CARD_SIZE + GAP);
                    card.y = Math.floor(k / cols) * (CARD_SIZE + GAP);
                });
                draw();
            }
        }

        function setupCanvas(rows, cols) {
            const canvasWidth = cols * (CARD_SIZE + GAP) - GAP;
            const canvasHeight = rows * (CARD_SIZE + GAP) - GAP;
            const dpr = window.devicePixelRatio || 1;

            canvas.width = canvasWidth * dpr;
            canvas.height = canvasHeight * dpr;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            canvas.style.width = `${canvasWidth}px`;
            canvas.style.height = `${canvasHeight}px`;
        }

        // Full character pool
        const nftPool = [
            { name: 'Jasper PFP', series: 1, src: './assets/Jasper_PFP_-Series_1.png' },
            { name: 'Lester PFP', series: 1, src: './assets/Lester_PFP_-Series_1.png' },
            { name: 'Horus PFP', series: 1, src: './assets/Horus_PFP_-Series_1.png' },
            { name: 'Angus PFP', series: 1, src: './assets/Angus_PFP_-Series_1.png' },
            { name: 'Hans PFP', series: 1, src: './assets/Hans_PFP_-Series_1.png' },
            { name: 'Leon PFP', series: 1, src: './assets/Leon_PFP_-Series_1.png' },
            { name: 'Ralph PFP', series: 1, src: './assets/Ralph_PFP_-Series_1.png' },
            { name: 'Walter PFP', series: 1, src: './assets/Walter_PFP_-Series_1.png' },
            { name: 'Jasper PFP', series: 2, src: './assets/Jasper_PFP_-Series_2.png' },
            { name: 'Hans PFP', series: 2, src: './assets/Hans_PFP_-Series_2.png' },
            { name: 'Angus PFP', series: 2, src: './assets/Angus_PFP_-Series_2.png' },
            { name: 'Leon PFP', series: 2, src: './assets/Leon_PFP_-Series_2.png' },
            { name: 'Horus PFP', series: 2, src: './assets/Horus_PFP_-Series_2.png' },
            { name: 'Lester PFP', series: 2, src: './assets/Lester_PFP_-Series_2.png' },
            { name: 'Ralph PFP', series: 2, src: './assets/Ralph_PFP_-Series_2.png' },
            { name: 'Walter PFP', series: 2, src: './assets/Walter_PFP_-Series_2.png' },
            { name: 'Calzone PFP 1', series: 3, src: './assets/Calzone_PFP_1_-Series_3.png' },
            { name: 'Calzone PFP 2', series: 3, src: './assets/Calzone_PFP_2_-Series_3.png' },
            { name: 'Calzone PFP 3', series: 3, src: './assets/Calzone_PFP_3_-Series_3.png' },
            { name: 'Calzone PFP 4', series: 3, src: './assets/Calzone_PFP_4_-Series_3.png' },
            { name: 'Calzone PFP 5', series: 3, src: './assets/Calzone_PFP_5_-Series_3.png' },
            { name: 'Calzone PFP 6', series: 3, src: './assets/Calzone_PFP_6_-Series_3.png' },
            { name: 'Calzone PFP 7', series: 3, src: './assets/Calzone_PFP_7_-Series_3.png' },
            { name: 'Calzone PFP 8', series: 3, src: './assets/Calzone_PFP_8_-Series_3.png' }
        ];

        // ---- Card backs: ONE uniform design for every card (no pair info leaks) ----
        const CARD_BACK = '#20b2aa';

        function roundRectPath(x, y, w, h, r) {
            r = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        // Card class
        class Card {
            constructor(x, y, image, name) {
                this.x = x;
                this.y = y;
                this.image = new Image();
                this.image.src = image;
                this.image.onerror = () => { console.error(`Failed to load image: ${image}`); };
                this.image.onload = () => { draw(); };
                this.name = name;
                this.flipped = false;
                this.flipTarget = false;
                this.flipping = false;
                this.flipProgress = 0;
                this.onFlipDone = null;
                this.matched = false;
                this.popT = null;    // match pop
                this.shakeT = null;  // mismatch shake
            }

            draw() {
                const cx = this.x + CARD_SIZE / 2;
                const cy = this.y + CARD_SIZE / 2;

                // mismatch shake -> horizontal jitter that damps out
                let shakeX = 0;
                if (this.shakeT !== null) {
                    shakeX = Math.sin(this.shakeT * Math.PI * 5) * 7 * (1 - this.shakeT);
                }
                // match pop -> brief scale bump
                let popScale = 1;
                if (this.popT !== null) {
                    popScale = 1 + 0.16 * Math.sin(this.popT * Math.PI);
                }

                const angle = this.flipProgress * Math.PI; // 0..PI while flipping
                const sx = Math.cos(angle);                  // 1 -> -1
                const wScale = Math.max(0.001, Math.abs(sx));
                const showFace = this.flipProgress < 0.5 ? this.flipped : this.flipTarget;

                ctx.save();
                ctx.translate(cx + shakeX, cy);
                ctx.scale(wScale * popScale, popScale);
                ctx.translate(-CARD_SIZE / 2, -CARD_SIZE / 2);

                const radius = Math.max(7, CARD_SIZE * 0.17);
                const lw = Math.max(2, CARD_SIZE * 0.045);

                if (showFace || this.matched) {
                    this.drawFace(radius, lw);
                } else {
                    this.drawBack(radius, lw);
                }
                ctx.restore();
            }

            drawFace(radius, lw) {
                const innerR = Math.max(3, radius - lw * 0.7);
                // black sticker base (the outline) — solid fill so corners never misalign
                ctx.fillStyle = '#000000';
                roundRectPath(0, 0, CARD_SIZE, CARD_SIZE, radius);
                ctx.fill();

                // tile inside the black border — gold frame once matched, white otherwise
                ctx.fillStyle = this.matched ? '#ffcc00' : '#ffffff';
                roundRectPath(lw, lw, CARD_SIZE - lw * 2, CARD_SIZE - lw * 2, innerR);
                ctx.fill();

                // character art inset on the white tile
                const inset = lw + Math.max(2, CARD_SIZE * 0.045);
                const artR = Math.max(2, innerR - lw);
                if (this.image.complete && this.image.naturalWidth !== 0) {
                    ctx.save();
                    roundRectPath(inset, inset, CARD_SIZE - inset * 2, CARD_SIZE - inset * 2, artR);
                    ctx.clip();
                    ctx.drawImage(this.image, inset, inset, CARD_SIZE - inset * 2, CARD_SIZE - inset * 2);
                    ctx.restore();
                } else {
                    ctx.fillStyle = '#e8e8e8';
                    roundRectPath(inset, inset, CARD_SIZE - inset * 2, CARD_SIZE - inset * 2, artR);
                    ctx.fill();
                }

                // (matched state is shown by the gold tile frame above — no separate
                // ring, which left white peeking at the corners.)
            }

            drawBack(radius, lw) {
                const innerR = Math.max(3, radius - lw * 0.7);
                // black sticker base (the outline)
                ctx.fillStyle = '#000000';
                roundRectPath(0, 0, CARD_SIZE, CARD_SIZE, radius);
                ctx.fill();

                // uniform teal tile inside the black border
                ctx.fillStyle = CARD_BACK;
                roundRectPath(lw, lw, CARD_SIZE - lw * 2, CARD_SIZE - lw * 2, innerR);
                ctx.fill();

                // subtle concentric inset squares (geometric, not branded), identical on all
                const pad1 = CARD_SIZE * 0.24;
                ctx.lineWidth = Math.max(2, CARD_SIZE * 0.032);
                ctx.strokeStyle = 'rgba(255,255,255,0.24)';
                roundRectPath(pad1, pad1, CARD_SIZE - pad1 * 2, CARD_SIZE - pad1 * 2, innerR * 0.5);
                ctx.stroke();

                const pad2 = CARD_SIZE * 0.37;
                ctx.strokeStyle = 'rgba(0,0,0,0.16)';
                roundRectPath(pad2, pad2, CARD_SIZE - pad2 * 2, CARD_SIZE - pad2 * 2, innerR * 0.4);
                ctx.stroke();
            }

            flip(target, onDone) {
                if (this.flipped === target && !this.flipping) { if (onDone) onDone(); return; }
                this.flipTarget = target;
                this.flipping = true;
                this.flipProgress = 0;
                this.onFlipDone = onDone || null;
                if (window.FarcadeSDK) window.FarcadeSDK.singlePlayer.actions.hapticFeedback();
                ensureTicker();
            }
            pop() { this.popT = 0; ensureTicker(); }
            shake() { this.shakeT = 0; ensureTicker(); }
        }

        function getRandomNFTs(count) {
            const shuffled = [...nftPool].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, count);
        }

        function hasAdjacentPairs(grid, rows, cols) {
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const cur = grid[i][j];
                    if (j + 1 < cols && grid[i][j + 1] && cur.src === grid[i][j + 1].src) return true;
                    if (i + 1 < rows && grid[i + 1][j] && cur.src === grid[i + 1][j].src) return true;
                }
            }
            return false;
        }

        function shuffleGridWithoutAdjacentPairs(deck, rows, cols) {
            let grid = Array(rows).fill().map(() => Array(cols).fill(null));
            let k = 0;
            for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) grid[i][j] = deck[k++];

            let attempts = 0;
            const maxAttempts = 1000;
            while (hasAdjacentPairs(grid, rows, cols) && attempts < maxAttempts) {
                outer:
                for (let i = 0; i < rows; i++) {
                    for (let j = 0; j < cols; j++) {
                        const cur = grid[i][j];
                        let bad = false;
                        if (j + 1 < cols && grid[i][j + 1] && cur.src === grid[i][j + 1].src) bad = true;
                        if (i + 1 < rows && grid[i + 1][j] && cur.src === grid[i + 1][j].src) bad = true;
                        if (bad) {
                            let si, sj;
                            do { si = Math.floor(Math.random() * rows); sj = Math.floor(Math.random() * cols); }
                            while (si === i && sj === j);
                            const t = grid[i][j]; grid[i][j] = grid[si][sj]; grid[si][sj] = t;
                            break outer;
                        }
                    }
                }
                attempts++;
            }

            const finalDeck = [];
            for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) finalDeck.push(grid[i][j]);
            return finalDeck;
        }

        // Initialize game
        function initGame() {
            hideWin();
            const [rows, cols] = GRID_SIZES[difficulty];
            const pairCount = (rows * cols) / 2;

            cards = [];
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            time = 0;
            gameLocked = false;
            gameWon = false;
            timerStarted = false;
            movesDisplay.textContent = '0';
            timerDisplay.textContent = '0:00';
            updateScore();
            clearInterval(timerInterval);

            adjustCardSize();
            const selected = getRandomNFTs(pairCount);
            let deck = [...selected, ...selected].sort(() => Math.random() - 0.5);
            deck = shuffleGridWithoutAdjacentPairs(deck, rows, cols);

            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const d = deck[i * cols + j];
                    cards.push(new Card(j * (CARD_SIZE + GAP), i * (CARD_SIZE + GAP), d.src, d.name));
                }
            }
            draw();

            if (window.FarcadeSDK) window.FarcadeSDK.singlePlayer.actions.ready();
            trackGA('play_start', { difficulty });
            trackTG('play_start').then(d => { if (d?.play_id) currentPlayId = d.play_id; });
        }

        function startTimerIfNeeded() {
            if (timerStarted) return;
            timerStarted = true;
            timerInterval = setInterval(updateTimer, 1000);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            cards.forEach(card => card.draw());
        }

        function updateTimer() {
            time++;
            const m = Math.floor(time / 60);
            const s = time % 60;
            timerDisplay.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
            updateScore();
        }

        function handleClick(x, y) {
            if (gameLocked || gameWon || flippedCards.length >= 2) return;

            const card = cards.find(c => {
                const inBounds = x >= c.x && x <= c.x + CARD_SIZE && y >= c.y && y <= c.y + CARD_SIZE;
                return !c.matched && !c.flipped && !c.flipping && inBounds;
            });
            if (!card) return;

            startTimerIfNeeded();
            gameLocked = true;
            flippedCards.push(card);
            card.flip(true, () => {
                if (flippedCards.length === 2) {
                    moves++;
                    movesDisplay.textContent = moves;
                    updateScore();
                    setTimeout(checkMatch, 260);
                } else {
                    gameLocked = false;
                }
            });
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            if (card1.image.src === card2.image.src) {
                card1.matched = card2.matched = true;
                card1.pop(); card2.pop();
                matchedPairs++;
                flippedCards = [];
                gameLocked = false;
                if (window.FarcadeSDK) window.FarcadeSDK.singlePlayer.actions.hapticFeedback();
                if (matchedPairs === (cards.length / 2)) setTimeout(endGame, 520);
            } else {
                card1.shake(); card2.shake();
                setTimeout(() => {
                    card1.flip(false);
                    card2.flip(false);
                    flippedCards = [];
                    gameLocked = false;
                }, 620);
            }
        }

        // ============================================
        // Win screen + confetti
        // ============================================
        const CONFETTI_COLORS = ['#20b2aa', '#9370db', '#ffcc00', '#ff1493', '#ff7a33'];
        function launchConfetti() {
            const root = document.getElementById('confetti');
            root.innerHTML = '';
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const N = 44;
            for (let i = 0; i < N; i++) {
                const p = document.createElement('div');
                p.className = 'confetti-piece';
                p.style.left = Math.random() * 100 + '%';
                p.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
                const dur = 1.6 + Math.random() * 1.6;
                p.style.animationDuration = dur + 's';
                p.style.animationDelay = (Math.random() * 0.5) + 's';
                p.style.height = (12 + Math.random() * 10) + 'px';
                p.style.transform = `rotate(${Math.random() * 360}deg)`;
                root.appendChild(p);
            }
        }
        function showWin(finalScore) {
            document.getElementById('win-score').textContent = finalScore.toLocaleString('en-US');
            document.getElementById('win-time').textContent = timerDisplay.textContent;
            document.getElementById('win-moves').textContent = moves;
            document.getElementById('win-sub').textContent = `${DIFF_LABEL[difficulty]} \u00b7 ${DIFF_GRID[difficulty]} cleared`;

            const next = NEXT_DIFF[difficulty];
            const nextBtn = document.getElementById('win-next');
            if (next) {
                nextBtn.style.display = '';
                nextBtn.textContent = `Try ${DIFF_LABEL[next]} Next`;
            } else {
                nextBtn.style.display = 'none';
                document.getElementById('win-title').textContent = 'Beast Master!';
            }
            // reset the pop-in animation
            const wc = document.getElementById('win-card');
            wc.style.animation = 'none'; void wc.offsetWidth; wc.style.animation = '';

            winEl.classList.add('show');
            launchConfetti();
        }
        function hideWin() {
            winEl.classList.remove('show');
            document.getElementById('confetti').innerHTML = '';
            document.getElementById('win-title').textContent = 'You Win!';
        }

        function endGame() {
            clearInterval(timerInterval);
            gameWon = true;
            const finalScore = computeScore();
            score = finalScore;
            scoreDisplay.textContent = finalScore.toLocaleString('en-US');
            trackGA('play_end', { score: finalScore, moves, time });
            trackTG('play_end', { score: finalScore, play_id: currentPlayId });

            // The full build loads the Farcade SDK everywhere, so SDK presence alone
            // is not "inside Farcade". Only defer to Farcade's own overlay when actually
            // embedded in its host (iframed, and not Telegram). Otherwise — Telegram,
            // plain web, kids build, and local testing — show our own win screen.
            const inFarcadeHost = !!window.FarcadeSDK && !inTelegram && window.self !== window.top;
            if (inFarcadeHost) {
                window.FarcadeSDK.singlePlayer.actions.gameOver({ score: finalScore });
            } else {
                showWin(finalScore);
            }
        }

        // ============================================
        // Controls
        // ============================================
        function setDifficulty(d) {
            if (!GRID_SIZES[d]) return;
            difficulty = d;
            segButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.difficulty === d)));
            initGame();
        }
        segButtons.forEach(b => b.addEventListener('click', () => setDifficulty(b.dataset.difficulty)));
        newGameBtn.addEventListener('click', () => initGame());
        document.getElementById('win-again').addEventListener('click', () => initGame());
        document.getElementById('win-next').addEventListener('click', () => {
            const next = NEXT_DIFF[difficulty];
            if (next) setDifficulty(next); else initGame();
        });

        // Pointer input
        const dpr = window.devicePixelRatio || 1;
        function canvasPoint(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const x = (clientX - rect.left) * (canvas.width / dpr) / rect.width;
            const y = (clientY - rect.top) * (canvas.height / dpr) / rect.height;
            return [x, y];
        }
        canvas.addEventListener('click', e => {
            const [x, y] = canvasPoint(e.clientX, e.clientY);
            handleClick(x, y);
        });
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const t = e.touches[0];
            const [x, y] = canvasPoint(t.clientX, t.clientY);
            handleClick(x, y);
        }, { passive: false });

        window.addEventListener('resize', adjustCardSize);
        window.addEventListener('orientationchange', adjustCardSize);

        if (window.FarcadeSDK) {
            window.FarcadeSDK.on('play_again', () => initGame());
            window.FarcadeSDK.on('toggle_mute', (data) => setMuted(data.isMuted));
        }

        // Start
        adjustCardSize();
        initGame();
    </script>
</body>
</html>
